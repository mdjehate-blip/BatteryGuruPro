name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev \
            patch libsqlite3-dev lld liblzma-dev

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install "cython==0.29.36"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Fix File Names & Create Clean buildozer.spec
        run: |
          if [ -f "main.py.txt" ]; then mv main.py.txt main.py; fi
          cat << 'EOF' > buildozer.spec
          [app]
          title = Battery Guru Pro
          package.name = batterygurupro
          package.domain = org.jehadul
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = FOREGROUND_SERVICE, WAKE_LOCK, POST_NOTIFICATIONS
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK with Smart SDK Fix
        run: |
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
          
          # ১ম রান: SDK ডাউনলোড ও ইনিশিয়াল বিল্ড
          if ! yes | buildozer android debug > build.log 2>&1; then
            echo "First pass stopped. Checking and fixing Android SDK Build-Tools..."
            
            # sdkmanager খুঁজে বের করে সঠিক build-tools 33.0.2 ইনস্টল করা এবং 36.0.0 রিমুভ করা
            SDKM=$(find ~/.buildozer -name "sdkmanager" | head -n 1)
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --sdk_root="$HOME/.buildozer/android/platform/android-sdk" "build-tools;33.0.2" "platforms;android-33" || true
              rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/36* || true
              rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/35* || true
            fi
            
            # ২য় রান: ফিক্সড SDK দিয়ে ফাইনাল বিল্ড
            if ! yes | buildozer android debug > build2.log 2>&1; then
              echo "================ REAL ERROR FOUND ================"
              grep -B 25 -A 5 "Command failed" build2.log || tail -n 200 build2.log | head -n 120
              echo "================ FIRST LOG ERROR ================="
              grep -B 25 -A 5 "Command failed" build.log || true
              exit 1
            fi
          fi
          echo "APK Built Successfully!"
          ls -la bin/

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuruPro-APK
          path: bin/*.apk
