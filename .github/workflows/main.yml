name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            automake libltdl-dev patch

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install "cython<3.0.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Check and Fix spec file name
        run: |
          if [ -f "buildozer.spec.txt" ]; then mv buildozer.spec.txt buildozer.spec; fi
          if [ -f "main.py.txt" ]; then mv main.py.txt main.py; fi
          ls -la

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuruPro-APK
          path: bin/*.apk
