name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev \
            patch libsqlite3-dev lld

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install "cython==0.29.36"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Auto-Configure Clean buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Battery Guru Pro
          package.name = batterygurupro
          package.domain = org.jehadul
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = FOREGROUND_SERVICE, WAKE_LOCK, POST_NOTIFICATIONS
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.build_tools_version = 33.0.2
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuruPro-APK
          path: bin/*.apk
