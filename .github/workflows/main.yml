name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11 (Required for Gradle APK packaging)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev \
            patch libsqlite3-dev lld liblzma-dev python3-venv

      - name: Install Buildozer & Locked Cython
        run: |
          pip install --upgrade "pip<24.0" "setuptools<69.0.0" wheel
          pip install "cython==0.29.36" virtualenv appdirs colorama jinja2 sh six toml packaging
          pip install buildozer==1.5.0

      - name: Create Clean buildozer.spec
        run: |
          if [ -f "main.py.txt" ]; then mv main.py.txt main.py; fi
          cat << 'EOF' > buildozer.spec
          [app]
          title = Battery Guru Pro
          package.name = batterygurupro
          package.domain = org.jehadul
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = hostpython3==3.11.6,python3==3.11.6,kivy==2.3.0,pyjnius==1.6.1,six
          orientation = portrait
          fullscreen = 0
          android.permissions = FOREGROUND_SERVICE, WAKE_LOCK, POST_NOTIFICATIONS
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Pre-configure Android SDK (Prevent SDK 36 Bug)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd "$SDK_DIR/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools tools
          yes | "$SDK_DIR/cmdline-tools/tools/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null

      - name: Build APK in Single Clean Pass
        run: |
          export PIP_NO_BUILD_ISOLATION=1
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
          export PIP_CONSTRAINT="${GITHUB_WORKSPACE}/constraints.txt"
          echo "cython==0.29.36" > "${GITHUB_WORKSPACE}/constraints.txt"
          echo "Cython==0.29.36" >> "${GITHUB_WORKSPACE}/constraints.txt"
          echo "setuptools<69.0.0" >> "${GITHUB_WORKSPACE}/constraints.txt"

          # যেহেতু আমরা আগেই SDK 33.0.2 বসিয়েছি, তাই Buildozer যেন নতুন করে 36.0.0 নামাতে না পারে:
          if ! yes | buildozer android debug > build.log 2>&1; then
            echo "================ GRADLE / BUILD ERROR DETAILS ================"
            grep -B 40 -A 20 "gradlew failed" build.log || tail -n 120 build.log
            exit 1
          fi
          echo "APK Built Successfully!"
          ls -la bin/

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuruPro-APK
          path: bin/*.apk
