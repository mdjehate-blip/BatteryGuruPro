name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev \
            patch libsqlite3-dev lld liblzma-dev

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install "cython==0.29.36"
          pip install buildozer==1.5.0

      - name: Auto-Configure Clean buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Battery Guru Pro
          package.name = batterygurupro
          package.domain = org.jehadul
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,pyjnius==1.6.1
          orientation = portrait
          fullscreen = 0
          android.permissions = FOREGROUND_SERVICE, WAKE_LOCK, POST_NOTIFICATIONS
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = develop

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK (With Auto Fix for SDK 36 Bug)
        run: |
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
          
          # ১ম চেষ্টায় যদি SDK 36 বাগের কারণে থামে, তবে নিজে থেকেই ফোল্ডারটি মুছে আবার বিল্ড করবে
          if ! yes | buildozer android debug > build.log 2>&1; then
            echo "Applying Android Build-Tools 36.0.0 Fix..."
            rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/36* || true
            rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/35* || true
            
            # ২য় বার চূড়ান্ত বিল্ড রান করা
            if ! yes | buildozer android debug >> build.log 2>&1; then
              echo "========== EXACT ERROR AT THE BOTTOM =========="
              tail -n 80 build.log
              exit 1
            fi
          fi
          echo "Build Successful!"
          ls -la bin/

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuruPro-APK
          path: bin/*.apk
