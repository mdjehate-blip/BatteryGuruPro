name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (With JDK 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev \
            patch libsqlite3-dev lld liblzma-dev python3-venv

      - name: Install Buildozer & Locked Toolchain Packages
        run: |
          pip install --upgrade "pip<24.0" "setuptools<69.0.0" wheel
          pip install "cython==0.29.36" virtualenv appdirs colorama jinja2 sh six toml packaging
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Create Clean buildozer.spec
        run: |
          if [ -f "main.py.txt" ]; then mv main.py.txt main.py; fi
          cat << 'EOF' > buildozer.spec
          [app]
          title = Battery Guru Pro
          package.name = batterygurupro
          package.domain = org.jehadul
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = hostpython3==3.11.6,python3==3.11.6,kivy==2.3.0,pyjnius==1.6.1,six
          orientation = portrait
          fullscreen = 0
          android.permissions = FOREGROUND_SERVICE, WAKE_LOCK, POST_NOTIFICATIONS
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Step 1 - Let Buildozer Download SDK & Fix Build-Tools BEFORE Compile
        run: |
          # এখানে শুধু SDK ও NDK ডাউনলোড হওয়ার পরই আমরা থামিয়ে দেব যাতে আগে Build-Tools ফিক্স করা যায়
          yes | buildozer android update || true
          
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKM=$(find "$SDK_DIR" -name "sdkmanager" | head -n 1)
          
          if [ -n "$SDKM" ]; then
            echo "Found sdkmanager at: $SDKM"
            # অফিশিয়াল build-tools 33.0.2 এবং platform 33 নিশ্চিত করা
            yes | "$SDKM" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
            
            # ভাঙা 36.0.0 এবং 35.0.0 মুছে ফেলা যাতে শুধুমাত্র 33.0.2 ব্যবহৃত হয়
            rm -rf "$SDK_DIR/build-tools/36"* || true
            rm -rf "$SDK_DIR/build-tools/35"* || true
            rm -rf "$SDK_DIR/build-tools/34"* || true
            echo "Remaining build-tools:"
            ls -la "$SDK_DIR/build-tools/"
          fi

      - name: Step 2 - Final APK Build (Single Clean Pass)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export PIP_NO_BUILD_ISOLATION=1
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
          export PIP_CONSTRAINT="${GITHUB_WORKSPACE}/constraints.txt"
          echo "cython==0.29.36" > "${GITHUB_WORKSPACE}/constraints.txt"
          echo "Cython==0.29.36" >> "${GITHUB_WORKSPACE}/constraints.txt"
          echo "setuptools<69.0
